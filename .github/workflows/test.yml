name: test

on:
  # Every branch, not just main. Filtering to main meant a feature branch could be
  # pushed, reviewed and merged without the suite ever running — and the Windows job
  # is the only place the PowerShell renderer executes at all.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run test suite
        working-directory: src/hooks
        run: npm test

  smoke-unix:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Exercises the real hook entrypoints end to end, the way Claude Code runs them.
      # The unit suite calls the exported functions; this runs the scripts.
      - name: SessionStart writes the flag and nothing else
        shell: bash
        run: |
          set -euo pipefail
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          export CLAUDE_PLUGIN_ROOT="$PWD"
          node src/hooks/critica-activate.js > /dev/null
          grep -qE '^active:[a-z]{2}:[0-9]+$' "$CLAUDE_CONFIG_DIR/.critique-active"
          # The badge is opt-in: a clean activation must not touch global config.
          test ! -e "$CLAUDE_CONFIG_DIR/settings.json" \
            || { echo "SessionStart created settings.json"; cat "$CLAUDE_CONFIG_DIR/settings.json"; exit 1; }
          test ! -e "$CLAUDE_CONFIG_DIR/hooks/critica-statusline.sh" \
            || { echo "SessionStart installed the badge without being asked"; exit 1; }

      - name: UserPromptSubmit injects context
        shell: bash
        run: |
          set -euo pipefail
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          echo '{"prompt":"review this code"}' | node src/hooks/critica-tracker.js \
            | grep -q 'CRITIQUE MODE ACTIVE'

      - name: Deactivation persists and reactivation restores injection
        shell: bash
        run: |
          set -euo pipefail
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          echo '{"prompt":"critique off"}' | node src/hooks/critica-tracker.js
          grep -qE '^off:' "$CLAUDE_CONFIG_DIR/.critique-active"
          out=$(echo '{"prompt":"and now review this"}' | node src/hooks/critica-tracker.js)
          test -z "$out" || { echo "off did not persist: $out"; exit 1; }
          echo '{"prompt":"critique on"}' | node src/hooks/critica-tracker.js
          echo '{"prompt":"review this code"}' | node src/hooks/critica-tracker.js \
            | grep -q 'CRITIQUE MODE ACTIVE'

      - name: Badge installs on request, renders, and clears when off
        shell: bash
        run: |
          set -euo pipefail
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          export CLAUDE_PLUGIN_ROOT="$PWD"
          node src/hooks/critica-badge.js status | grep -q 'not installed'
          node src/hooks/critica-badge.js
          bash "$CLAUDE_CONFIG_DIR/hooks/critica-statusline.sh" | grep -q 'CRITIQUE'
          echo '{"prompt":"critique off"}' | node src/hooks/critica-tracker.js
          badge=$(bash "$CLAUDE_CONFIG_DIR/hooks/critica-statusline.sh")
          test -z "$badge" || { echo "badge still rendering while off: $badge"; exit 1; }

      - name: Badge off restores a third-party statusline byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude2"
          export CLAUDE_PLUGIN_ROOT="$PWD"
          mkdir -p "$CLAUDE_CONFIG_DIR/hooks"
          agg="$CLAUDE_CONFIG_DIR/hooks/mine.sh"
          printf '#!/usr/bin/env bash\nprintf "[OTHER]"\nexit 0\n' > "$agg"
          cp "$agg" "$RUNNER_TEMP/mine.orig"
          node -e "require('fs').writeFileSync(process.env.CLAUDE_CONFIG_DIR + '/settings.json', JSON.stringify({ model: 'opus', statusLine: { type: 'command', command: 'bash \"' + process.env.CLAUDE_CONFIG_DIR + '/hooks/mine.sh\"' } }))"
          node src/hooks/critica-activate.js > /dev/null
          node src/hooks/critica-badge.js
          bash "$agg" | grep -q 'OTHER'
          bash "$agg" | grep -q 'CRITIQUE'
          node src/hooks/critica-badge.js off
          diff "$RUNNER_TEMP/mine.orig" "$agg" || { echo "off did not restore the script"; exit 1; }
          node -e "
            const s = require(process.env.CLAUDE_CONFIG_DIR + '/settings.json');
            if (s.model !== 'opus') { console.error('user settings lost'); process.exit(1); }
            if (!s.statusLine) { console.error('user statusLine removed — plugin did not set it'); process.exit(1); }
          "

  smoke-windows:
    name: smoke (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Windows branch of the badge installer and the PowerShell renderer cannot be
      # exercised on any other runner. Everything below is Windows-only coverage.
      - name: SessionStart writes the flag and nothing else
        shell: pwsh
        run: |
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'claude'
          $env:CLAUDE_PLUGIN_ROOT = $PWD.Path
          node src/hooks/critica-activate.js | Out-Null
          $flag = Join-Path $env:CLAUDE_CONFIG_DIR '.critique-active'
          if ((Get-Content -Raw $flag).Trim() -notmatch '^active:[a-z]{2}:\d+$') { throw 'bad flag' }
          if (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR 'settings.json')) { throw 'SessionStart created settings.json' }
          if (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR 'hooks\critica-statusline.ps1')) { throw 'badge installed unasked' }

      - name: Badge installs on request and the registered command renders it
        shell: pwsh
        run: |
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'claude'
          $env:CLAUDE_PLUGIN_ROOT = $PWD.Path
          node src/hooks/critica-badge.js
          $badge = Join-Path $env:CLAUDE_CONFIG_DIR 'hooks\critica-statusline.ps1'
          if (-not (Test-Path $badge)) { throw 'badge script not copied' }
          $settings = Get-Content -Raw (Join-Path $env:CLAUDE_CONFIG_DIR 'settings.json') | ConvertFrom-Json
          # The stored command must contain the real path, not a pre-escaped one.
          if ($settings.statusLine.command -notlike "*$badge*") {
            throw "path mangled in statusLine: $($settings.statusLine.command)"
          }
          # cmd.exe is what actually parses this string.
          $out = & cmd /c $settings.statusLine.command
          if ("$out" -notmatch 'CRITIQUE') { throw "badge did not render: $out" }

      - name: Deactivation clears the PowerShell badge
        shell: pwsh
        run: |
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'claude'
          '{"prompt":"critique off"}' | node src/hooks/critica-tracker.js | Out-Null
          $flag = Join-Path $env:CLAUDE_CONFIG_DIR '.critique-active'
          if ((Get-Content -Raw $flag).Trim() -notmatch '^off:') { throw 'off not written' }
          $out = '{"prompt":"and now review this"}' | node src/hooks/critica-tracker.js
          if ($out) { throw "off did not persist: $out" }
          $badge = & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:CLAUDE_CONFIG_DIR 'hooks\critica-statusline.ps1')
          if ($badge) { throw "badge still rendering while off: $badge" }

      - name: Badge splices into a CRLF aggregator before its exit, and off restores it
        shell: pwsh
        run: |
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'claude2'
          $env:CLAUDE_PLUGIN_ROOT = $PWD.Path
          New-Item -ItemType Directory -Force -Path (Join-Path $env:CLAUDE_CONFIG_DIR 'hooks') | Out-Null
          $agg = Join-Path $env:CLAUDE_CONFIG_DIR 'hooks\aggregator.ps1'
          Set-Content -Path $agg -Value "Write-Host -NoNewline '[OTHER]'`r`nexit 0" -NoNewline
          $orig = Get-Content -Raw $agg
          $settings = @{ statusLine = @{ type = 'command'; command = "powershell -NoProfile -ExecutionPolicy Bypass -File `"$agg`"" } }
          $settings | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:CLAUDE_CONFIG_DIR 'settings.json')
          node src/hooks/critica-activate.js | Out-Null
          node src/hooks/critica-badge.js
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File $agg
          if ("$out" -notmatch '\[OTHER\]') { throw "aggregator output lost: $out" }
          if ("$out" -notmatch 'CRITIQUE') { throw "badge unreachable after exit 0: $out" }
          node src/hooks/critica-badge.js off
          if ((Get-Content -Raw $agg) -ne $orig) { throw 'off did not restore the aggregator' }

  validate:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Manifest version is the only one
        run: |
          set -euo pipefail
          test ! -f plugin.json      || { echo "root plugin.json is back — version now lives in two files"; exit 1; }
          test ! -f marketplace.json || { echo "root marketplace.json is back"; exit 1; }
          node -e "
            const v = require('./.claude-plugin/plugin.json').version;
            if (!/^\d+\.\d+\.\d+$/.test(v)) { console.error('bad version: ' + v); process.exit(1); }
            console.log('version ' + v);
          "
      - name: Hooks are registered exactly once
        run: |
          set -euo pipefail
          node -e "
            const h = require('./hooks/hooks.json').hooks;
            for (const ev of ['SessionStart', 'UserPromptSubmit']) {
              const n = (h[ev] || []).flatMap(g => g.hooks || []).length;
              if (n !== 1) { console.error(ev + ' has ' + n + ' hooks, expected 1'); process.exit(1); }
            }
            const src = require('fs').readFileSync('src/hooks/critica-activate.js', 'utf8');
            if (/function setupHooks/.test(src)) {
              console.error('setupHooks is back — it double-registers against hooks/hooks.json');
              process.exit(1);
            }
          "
      - name: SessionStart does not install the badge
        run: |
          set -euo pipefail
          node -e "
            const src = require('fs').readFileSync('src/hooks/critica-activate.js', 'utf8');
            for (const banned of ['badge.install', 'setupStatusline', 'injectIntoBadgeAggregator']) {
              if (src.includes(banned)) {
                console.error('critica-activate.js calls ' + banned + ' — the badge must stay opt-in');
                process.exit(1);
              }
            }
            if (!src.includes('refreshIfInstalled')) {
              console.error('the refresh-only path is gone; an installed badge will go stale');
              process.exit(1);
            }
          "
