name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is in the matrix because the plugin ships a PowerShell renderer and every
    # Windows bug this plugin has had was an assumption no Unix runner could catch. The
    # 1.5.2 validation that finally exercised the (Get-Culture) branch was done by hand.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # repo.test.js asserts on tags and on main's history: a shallow clone has
          # neither, and every CHANGELOG link would look like it points at a missing tag.
          fetch-depth: 0

      - name: Make main available locally
        shell: bash
        # A pull request is checked out detached, so `main` exists only as a remote ref
        # and the reachability assertion cannot resolve it. Fetching into the current
        # branch is refused, which is exactly the push-to-main case, where it is already
        # there — hence the guard rather than a failure.
        run: git fetch origin main:main || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm test
        working-directory: src/hooks
